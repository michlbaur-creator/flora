<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2F4F3E">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flora Mibaso">
<title>Pflanzenquiz – Ebsdorfer Grund</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #f8f5f0;
    color: #2c2c2c;
    min-height: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 10px 8px;
  }

  header {
    text-align: center;
    margin-bottom: 6px;
  }
  header h1 {
    font-size: 1.15rem;
    color: #3A5F4A;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  header p {
    font-size: 0.78rem;
    color: #666;
    margin-top: 1px;
    font-style: italic;
  }

  #quiz-box {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.10);
    max-width: 560px;
    width: 100%;
    overflow: hidden;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* ── Startscreen ── */
  #start-screen {
    padding: 20px 24px;
    text-align: center;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  #start-screen h2 { color: #3A5F4A; margin-bottom: 8px; font-size: 1.1rem; }
  #start-screen p { color: #555; line-height: 1.5; margin-bottom: 16px; font-size: 0.92rem; }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
    font-size: 0.92rem;
    color: #444;
  }
  .setting-row select {
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.95rem;
    color: #333;
    background: #fafafa;
  }

  /* ── Progress bar ── */
  #progress-bar-wrap {
    height: 6px;
    background: #e8e8e8;
  }
  #progress-bar {
    height: 100%;
    background: #3A5F4A;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* ── Question screen ── */
  #question-screen { display: none; }

  #question-header {
    padding: 8px 16px 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #f0f0f0;
  }
  #question-counter { font-size: 0.85rem; color: #888; }
  #score-display { font-size: 0.85rem; color: #3A5F4A; font-weight: bold; }

  #photo-wrap {
    background: #111;
    position: relative;
    width: 100%;
    padding-top: 100%;
  }
  #plant-photo {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.3s;
  }
  #loading-spinner {
    position: absolute;
    color: #aaa;
    font-size: 0.9rem;
    font-style: italic;
  }

  #question-text {
    padding: 6px 14px 4px;
    font-size: 0.95rem;
    color: #333;
    text-align: center;
  }

  #answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    padding: 6px 12px 10px;
  }

  .answer-btn {
    background: #f4f1eb;
    border: 2px solid #ddd;
    border-radius: 8px;
    padding: 7px 8px;
    font-size: 0.85rem;
    font-family: Georgia, serif;
    color: #333;
    cursor: pointer;
    text-align: center;
    line-height: 1.25;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .answer-btn:hover:not(:disabled) {
    background: #e8f0e0;
    border-color: #3A5F4A;
    transform: translateY(-1px);
  }
  .answer-btn.correct {
    background: #e0ede8;
    border-color: #3A5F4A;
    color: #2F4F3E;
    font-weight: bold;
  }
  .answer-btn.wrong {
    background: #f8d7da;
    border-color: #c0392b;
    color: #721c24;
  }
  .answer-btn:disabled { cursor: default; }

  #feedback {
    text-align: center;
    padding: 0 14px 2px;
    font-size: 0.9rem;
    min-height: 18px;
    color: #555;
    font-style: italic;
  }

  #next-btn {
    display: none;
    margin: 2px 12px 8px;
    width: calc(100% - 24px);
    padding: 8px;
    background: #3A5F4A;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: Georgia, serif;
    cursor: pointer;
    transition: background 0.2s;
  }
  #next-btn:hover { background: #2F4F3E; }
  #mehr-link {
    display: block;
    text-align: center;
    margin: 2px 12px 6px;
    font-size: 0.88rem;
    color: #3A5F4A;
    text-decoration: none;
  }
  #mehr-link:hover { text-decoration: underline; }

  /* ── Result screen ── */
  #result-screen {
    display: none;
    padding: 20px 24px;
    text-align: center;
    flex: 1;
    display: none;
    flex-direction: column;
    justify-content: center;
  }
  #result-screen h2 { color: #3A5F4A; font-size: 1.3rem; margin-bottom: 6px; }
  #result-score { font-size: 2.5rem; font-weight: bold; color: #3A5F4A; margin: 8px 0; }
  #result-msg { color: #555; margin-bottom: 8px; font-style: italic; line-height: 1.5; }
  #result-detail { font-size: 0.85rem; color: #888; margin-bottom: 28px; }

  #wrong-list {
    text-align: left;
    margin-bottom: 28px;
    display: none;
  }
  #wrong-list h3 { color: #555; font-size: 0.9rem; margin-bottom: 10px; }
  .wrong-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 0.85rem;
    padding: 6px 10px;
    background: #fdf5f5;
    border-radius: 6px;
  }
  .wrong-item img {
    width: 48px;
    height: 36px;
    object-fit: cover;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .wrong-item .wi-names { flex: 1; }
  .wi-correct { color: #2F4F3E; font-weight: bold; }
  .wi-given { color: #721c24; font-size: 0.8rem; }

  .btn-primary {
    display: inline-block;
    padding: 12px 28px;
    background: #3A5F4A;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-family: Georgia, serif;
    cursor: pointer;
    transition: background 0.2s;
    text-decoration: none;
  }
  .btn-primary:hover { background: #2F4F3E; }

  footer {
    margin-top: 10px;
    font-size: 0.72rem;
    color: #aaa;
    text-align: center;
  }
  footer a { color: #3A5F4A; text-decoration: none; }

  /* ── Fotoleiste Startscreen ── */
  #start-photos {
    display: flex;
    height: 140px;
    overflow: hidden;
    border-radius: 10px 10px 0 0;
    margin-bottom: 0;
    flex-shrink: 0;
  }
  #start-photos img {
    flex: 1;
    object-fit: cover;
    min-width: 0;
    display: block;
    transition: transform 0.4s ease;
    filter: brightness(0.92) saturate(1.1);
  }
  #start-photos img:hover { transform: scale(1.04); filter: brightness(1) saturate(1.2); }
  #start-photos img:not(:last-child) { border-right: 2px solid white; }

  /* ── Konfetti & Sieges-Animation ── */
  @keyframes konfetti-regen {
    0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(200px) rotate(540deg); opacity: 0; }
  }
  @keyframes bounce-in {
    0%   { transform: scale(0.3); }
    55%  { transform: scale(1.15); }
    75%  { transform: scale(0.92); }
    90%  { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  #confetti-field {
    position: relative;
    height: 120px;
    overflow: hidden;
    width: 100%;
    margin-bottom: 10px;
  }
  .konfetti-stück {
    position: absolute;
    top: -10px;
    border-radius: 2px;
    animation: konfetti-regen linear infinite;
  }
  #sieger-msg {
    font-size: 1.05rem;
    font-weight: bold;
    color: #3A5F4A;
    background: #e8f4ed;
    border: 2px solid #3A5F4A;
    border-radius: 10px;
    padding: 12px 16px;
    margin: 8px 0 14px;
    animation: bounce-in 0.7s cubic-bezier(0.36,0.07,0.19,0.97) forwards;
  }
</style>
</head>
<body>

<header>
  <h1>🌿 Was blüht denn hier?</h1>
  <p>Das Quiz zum Bestimmungstool</p>
</header>

<div id="quiz-box">

  <!-- ══ STARTSCREEN ══ -->
  <div id="start-screen">
    <div id="start-photos">
      <img src="https://flora.mibaso.de/images/fotos/hepatica-nobilis-1.jpg" alt="Leberblümchen">
      <img src="https://flora.mibaso.de/images/fotos/digitalis-purpurea-1.jpg" alt="Fingerhut">
      <img src="https://flora.mibaso.de/images/fotos/galanthus-nivalis-1.jpg" alt="Schneeglöckchen">
      <img src="https://flora.mibaso.de/images/fotos/primula-veris-1.jpg" alt="Schlüsselblume">
    </div>
    <h2 style="margin-top: 18px;">Erkennst du die Art?</h2>
    <p>Tippe auf die richtige Antwort.</p>
    <div class="setting-row">
      <label for="num-q">Anzahl Fragen:</label>
      <select id="num-q">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="15">15</option>
        <option value="20">20</option>
      </select>
    </div>
    <button class="btn-primary" id="start-btn" onclick="startQuiz()" disabled>Lädt …</button>
  </div>

  <!-- ══ QUESTION SCREEN ══ -->
  <div id="question-screen">
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    <div id="question-header">
      <span id="question-counter">Frage 1 / 10</span>
      <span id="score-display">✓ 0</span>
    </div>
    <div id="photo-wrap">
      <span id="loading-spinner">Lädt …</span>
      <img id="plant-photo" src="" alt="Pflanzenfoto" style="opacity:0"
           onload="photoLoaded()" onerror="photoError()">
    </div>
    <div id="question-text">Wie heißt diese Pflanze?</div>
    <div id="answers"></div>
    <div id="feedback"></div>
    <a id="mehr-link" href="#" target="_blank" rel="noopener" style="display:none;">Mehr zu dieser Art →</a>
    <button id="next-btn" onclick="nextQuestion()">Weiter →</button>
  </div>

  <!-- ══ RESULT SCREEN ══ -->
  <div id="result-screen">
    <h2>Ergebnis</h2>
    <div id="result-score"></div>
    <div id="result-msg"></div>
    <div id="result-detail"></div>
    <div id="wrong-list"><h3>Nicht erkannt:</h3><div id="wrong-items"></div></div>
    <div id="perfect-block" style="display:none"></div>
    <button class="btn-primary" onclick="resetQuiz()">Auf ein Neues! 🌿</button>
  </div>

</div>

<footer>
  © 2026 <a href="../ueber/">Michael Baur</a> · Flora Mibaso
</footer>

<script>
// ═══════════════════════════════════════════════════
//  PFLANZENDATEN – alle Arten aus flora.mibaso.de
//  Format: { slug, name, latein }
// ═══════════════════════════════════════════════════
let ARTEN = [];  // wird aus pflanzen.json geladen

// ═══════════════════════════════════════════════════
//  HILFSFUNKTIONEN
// ═══════════════════════════════════════════════════

function shuffle(arr) {
  // Fisher-Yates-Shuffle: zufällige Reihenfolge
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fotoUrl(slug, nr = 1) {
  return `https://flora.mibaso.de/images/fotos/${slug}-${nr}.jpg`;
}

// ═══════════════════════════════════════════════════
//  SPIELZUSTAND
// ═══════════════════════════════════════════════════

let questions = [];   // die zufällig gewählten Arten für diese Runde
let current = 0;      // aktueller Frageindex
let score = 0;        // richtige Antworten
let answered = false; // wurde die aktuelle Frage schon beantwortet?
let wrongAnswers = []; // falsch beantwortete für Auswertung
let totalQ = 10;

// ═══════════════════════════════════════════════════
//  QUIZ STARTEN
// ═══════════════════════════════════════════════════

function startQuiz() {
  if (!ARTEN.length) return;
  totalQ = parseInt(document.getElementById('num-q').value);
  questions = shuffle(ARTEN).slice(0, totalQ);
  current = 0;
  score = 0;
  answered = false;
  wrongAnswers = [];

  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('question-screen').style.display = 'block';

  showQuestion();
}

// ═══════════════════════════════════════════════════
//  FRAGE ANZEIGEN
// ═══════════════════════════════════════════════════

function showQuestion() {
  answered = false;
  const art = questions[current];

  // Fortschrittsbalken
  document.getElementById('progress-bar').style.width =
    ((current / totalQ) * 100) + '%';

  // Zähler & Score
  document.getElementById('question-counter').textContent =
    `Frage ${current + 1} / ${totalQ}`;
  document.getElementById('score-display').textContent = `✓ ${score}`;

  // Feedback zurücksetzen
  document.getElementById('feedback').textContent = '';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('mehr-link').style.display = 'none';

  // Foto laden
  const img = document.getElementById('plant-photo');
  const spinner = document.getElementById('loading-spinner');
  img.style.opacity = 0;
  spinner.style.display = 'block';
  img.src = fotoUrl(art.slug, 1);

  // 4 Antwortoptionen: 1 richtig + 3 zufällige Falsche
  const falsche = shuffle(ARTEN.filter(a => a.slug !== art.slug)).slice(0, 3);
  const optionen = shuffle([art, ...falsche]);

  const container = document.getElementById('answers');
  container.innerHTML = '';
  optionen.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = `<strong>${opt.name}</strong><br><em style="font-size:0.8rem;color:#888">${opt.latein}</em>`;
    btn.onclick = () => checkAnswer(opt.slug === art.slug, btn, art);
    container.appendChild(btn);
  });
}

// ═══════════════════════════════════════════════════
//  FOTO-EVENTS
// ═══════════════════════════════════════════════════

function photoLoaded() {
  document.getElementById('loading-spinner').style.display = 'none';
  document.getElementById('plant-photo').style.opacity = 1;
}

function photoError() {
  // Falls Foto-1 nicht vorhanden, versuche Tafel als Fallback
  // (Tafel hat zwar den Namen, aber besser als leeres Bild)
  const art = questions[current];
  const img = document.getElementById('plant-photo');
  if (!img.src.includes('tafeln')) {
    img.src = `https://flora.mibaso.de/images/tafeln/${art.slug}.jpg`;
  } else {
    document.getElementById('loading-spinner').textContent = '(kein Foto verfügbar)';
  }
}

// ═══════════════════════════════════════════════════
//  ANTWORT PRÜFEN
// ═══════════════════════════════════════════════════

function checkAnswer(isCorrect, clickedBtn, art) {
  if (answered) return;
  answered = true;

  // Alle Buttons markieren
  const buttons = document.querySelectorAll('.answer-btn');
  buttons.forEach(btn => {
    btn.disabled = true;
    // Richtigen Button grün einfärben
    if (btn.innerHTML.includes(`>${art.name}<`)) {
      btn.classList.add('correct');
    }
  });

  if (isCorrect) {
    score++;
    document.getElementById('feedback').textContent = '✓ Richtig!';
    document.getElementById('score-display').textContent = `✓ ${score}`;
  } else {
    clickedBtn.classList.add('wrong');
    document.getElementById('feedback').textContent =
      `✗ Es war: ${art.name}`;
    wrongAnswers.push({ art, given: clickedBtn.querySelector('strong').textContent });
  }

  const ml = document.getElementById('mehr-link');
  ml.href = '../arten/' + art.slug + '.html';
  ml.style.display = 'block';

  document.getElementById('next-btn').style.display = 'block';
}

// ═══════════════════════════════════════════════════
//  NÄCHSTE FRAGE / ERGEBNIS
// ═══════════════════════════════════════════════════

function nextQuestion() {
  current++;
  if (current >= totalQ) {
    showResult();
  } else {
    showQuestion();
  }
}

// ═══════════════════════════════════════════════════
//  ERGEBNIS ANZEIGEN
// ═══════════════════════════════════════════════════

function showResult() {
  document.getElementById('question-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  document.getElementById('progress-bar').style.width = '100%';

  document.getElementById('result-score').textContent =
    `${score} / ${totalQ}`;

  // Bewertungstext
  const pct = score / totalQ;
  let msg = '';
  if (pct === 1)       msg = '';
  else if (pct >= 0.8) msg = 'Sehr gut! Fast alles erkannt.';
  else if (pct >= 0.6) msg = 'Gut! Mit etwas Übung kennst du bald alle.';
  else if (pct >= 0.4) msg = 'Nicht schlecht — die nächste Exkursion bringt mehr Sicherheit.';
  else                 msg = 'Noch viel zu entdecken — perfekt für die nächste Exkursion!';

  document.getElementById('result-msg').textContent = msg;
  document.getElementById('result-detail').textContent =
    `${score} richtig, ${totalQ - score} nicht erkannt`;

  // Perfekt-Ergebnis: 60 Konfetti + federnde Siegermeldung + Zufallsspruch
  const perfectBlock = document.getElementById('perfect-block');
  if (score === totalQ) {
    const sprueche = [
      "🍾 Prost! Alle richtig – Botanik-Champion entdeckt!",
      "🚀 Abgehoben! Du kennst die Pflanzen in- und auswendig!",
      "🎊 Sensationell! Dein Pflanzenwissen verdient einen Blumenstrauß!",
      "🏆 Goldmedaille! Du bist das wandelnde Pflanzenlexikon!"
    ];
    const spruch = sprueche[Math.floor(Math.random() * sprueche.length)];

    const konfettiColors = [
      '#3A5F4A','#2F4F3E','#6aab7a','#a8d5b5',
      '#f4c430','#e8a020',
      '#c0392b','#e74c3c',
      '#3498db','#2980b9',
      '#9b59b6','#8e44ad'
    ];

    // 60 Konfetti-Schnipsel
    let html = '<div id="confetti-field">';
    for (let i = 0; i < 60; i++) {
      const c = konfettiColors[Math.floor(Math.random() * konfettiColors.length)];
      const left = (Math.random() * 96).toFixed(1);
      const delay = (Math.random() * 2.5).toFixed(2);
      const dur = (1.4 + Math.random() * 1.4).toFixed(2);
      const w = 5 + Math.floor(Math.random() * 7);
      const h = 5 + Math.floor(Math.random() * 7);
      const rot = Math.floor(Math.random() * 360);
      html += `<div class="konfetti-stück" style="background:${c};left:${left}%;width:${w}px;height:${h}px;animation-delay:${delay}s;animation-duration:${dur}s;transform:rotate(${rot}deg)"></div>`;
    }
    html += '</div>';
    html += `<div id="sieger-msg">${spruch}</div>`;

    perfectBlock.innerHTML = html;
    perfectBlock.style.display = 'block';

    // Animation läuft automatisch per CSS (0.4s Verzögerung)
  } else {
    perfectBlock.style.display = 'none';
    perfectBlock.innerHTML = '';
  }

  // Falsche Antworten auflisten
  const wrongList = document.getElementById('wrong-list');
  const wrongItems = document.getElementById('wrong-items');
  wrongItems.innerHTML = '';

  if (wrongAnswers.length > 0) {
    wrongList.style.display = 'block';
    wrongAnswers.forEach(w => {
      const div = document.createElement('div');
      div.className = 'wrong-item';
      div.innerHTML = `
        <img src="${fotoUrl(w.art.slug)}" alt="${w.art.name}"
             onerror="this.src='https://flora.mibaso.de/images/tafeln/${w.art.slug}.jpg'">
        <div class="wi-names">
          <div class="wi-correct">${w.art.name}</div>
          <div class="wi-given">Du tipptest: ${w.given}</div>
        </div>
      `;
      wrongItems.appendChild(div);
    });
  } else {
    wrongList.style.display = 'none';
  }
}

// ═══════════════════════════════════════════════════
//  QUIZ ZURÜCKSETZEN
// ═══════════════════════════════════════════════════

function resetQuiz() {
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'block';
  document.getElementById('progress-bar').style.width = '0%';
  sendHeight();
}

// ═══════════════════════════════════════════════════
//  AUTO-RESIZE: Höhe an Parent-Seite (WordPress) senden
// ═══════════════════════════════════════════════════

function sendHeight() {
  const box = document.getElementById('quiz-box');
  const header = document.querySelector('header');
  const footer = document.querySelector('footer');
  const headerH = header ? header.offsetHeight + 20 : 0;
  const footerH = footer ? footer.offsetHeight + 10 : 0;
  const boxH = box ? box.offsetHeight : 0;
  const h = headerH + boxH + footerH + 20;
  window.parent.postMessage({ quizHeight: h }, '*');
}

// Nach jedem Laden und bei Zustandswechseln senden
// Pflanzendaten aus zentraler Quelle laden (Arten mit Foto)
fetch('../pflanzen.json')
  .then(function (r) { return r.json(); })
  .then(function (d) {
    ARTEN = d.filter(function (p) { return p.foto; })
             .map(function (p) { return { slug: p.slug, name: p.deutsch, latein: p.wiss }; });
    var sb = document.getElementById('start-btn');
    if (sb) { sb.disabled = false; sb.textContent = 'Quiz starten'; }
  })
  .catch(function () {
    var sb = document.getElementById('start-btn');
    if (sb) sb.textContent = 'Daten nicht verfügbar';
  });

window.addEventListener('load', sendHeight);
window.addEventListener('resize', sendHeight);

// MutationObserver: erkennt Änderungen im DOM (Fragen, Ergebnis usw.)
const observer = new MutationObserver(sendHeight);
observer.observe(document.body, { childList: true, subtree: true, attributes: true });
</script>
