<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5d6f7b">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flora Mibaso">
<title>Verwandte finden – Familien-Quiz</title>
<link rel="stylesheet" href="../assets/style.css">
<meta name="description" content="Familien-Quiz: Welche Pflanze gehört nicht zu den anderen drei?">
<style>
  :root{
    --ordnen:#5d6f7b;
    --ordnen-tief:#3f4d57;
    --ordnen-bg:#e8edf1;
    --ordnen-rand:#cdd6dd;
    --gruen-ok:#3a7a4a;
    --gruen-ok-bg:#dfeede;
    --rot-fehler:#a84236;
    --rot-fehler-bg:#f5dcd8;
  }

  body{ background:var(--beige-hell, #f8f3e7); }

  #fq-root{
    max-width:680px;
    margin:0 auto;
    padding:max(10px, env(safe-area-inset-top)) 12px 40px;
  }

  .fq-kopfzeile{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:0 0 6px;
  }
  .fq-home{
    display:inline-flex;
    align-items:center;
    color:var(--braun-mittel, #6b5340);
    text-decoration:none;
    font-size:.9rem;
  }
  .fq-home:hover{ color:var(--braun-dunkel, #3a2a1b); }

  .fq-titel{
    font-family:Georgia, serif;
    text-align:center;
    color:var(--ordnen-tief);
    margin:0 0 10px;
    font-size:1.1rem;
    font-weight:600;
    line-height:1.25;
  }
  .fq-zaehler{
    color:#6b7a83;
    font-size:.85rem;
    white-space:nowrap;
  }

  /* 2×2 Karten-Grid */
  .fq-karten{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
  }
  .fq-karte{
    background:#fff;
    border:2px solid var(--ordnen-rand);
    border-radius:14px;
    padding:8px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    transition:transform .12s ease, box-shadow .12s ease, border-color .15s ease, background .15s ease;
    font:inherit;
    color:inherit;
  }
  .fq-karte:hover:not(.locked), .fq-karte:focus-visible:not(.locked){
    transform:translateY(-2px);
    border-color:var(--ordnen);
    box-shadow:0 6px 16px rgba(93,111,123,.18);
    outline:none;
  }
  .fq-karte img{
    width:100%;
    aspect-ratio:1 / 1;
    object-fit:cover;
    border-radius:10px;
    background:#f4f0e8;
  }
  .fq-karte .name{
    color:var(--ordnen-tief);
    font-weight:600;
    font-size:.88rem;
    line-height:1.2;
    margin-top:6px;
    overflow-wrap:anywhere;
    hyphens:auto;
    -webkit-hyphens:auto;
  }
  .fq-karte .latein{
    color:#8b97a0;
    font-style:italic;
    font-size:.76rem;
    line-height:1.15;
    margin-top:1px;
  }

  /* Markierungen nach Auswertung */
  .fq-karte.aussenseiter{
    border-color:var(--gruen-ok);
    background:var(--gruen-ok-bg);
  }
  .fq-karte.aussenseiter .name{ color:var(--gruen-ok); }
  .fq-karte.falsch{
    border-color:var(--rot-fehler);
    background:var(--rot-fehler-bg);
  }
  .fq-karte.falsch .name{ color:var(--rot-fehler); }
  .fq-karte.locked{ cursor:default; }

  /* Auflösungs-Box */
  .fq-aufloesung{
    margin:12px 0 0;
    padding:12px 14px;
    border-radius:12px;
    background:#fff;
    border:1px solid var(--ordnen-rand);
    box-shadow:0 1px 4px rgba(63,77,87,.05);
    display:none;
  }
  .fq-aufloesung.aktiv{ display:block; }
  .fq-aufloesung h3{
    margin:0 0 6px;
    color:var(--ordnen-tief);
    font-family:Georgia, serif;
    font-size:1.1rem;
  }
  .fq-aufloesung h3.korrekt{ color:var(--gruen-ok); }
  .fq-aufloesung h3.falsch  { color:var(--rot-fehler); }
  .fq-aufloesung p{
    margin:6px 0 0;
    color:#3a3a3a;
    line-height:1.5;
    font-size:.96rem;
  }
  .fq-aufloesung .familie-name{
    font-weight:600;
    color:var(--ordnen-tief);
  }

  .fq-buttons{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:10px;
    position:sticky;
    bottom:0;
    padding:10px 0 max(10px, env(safe-area-inset-bottom));
    background:linear-gradient(to bottom, transparent 0%, var(--beige-hell, #f8f3e7) 25%);
    z-index:5;
  }

  /* Sieger-Ehrung */
  .fq-ergebnis{
    margin:18px 0 0;
    padding:22px 18px;
    border-radius:14px;
    background:#fff;
    border:1px solid var(--ordnen-rand);
    box-shadow:0 1px 4px rgba(63,77,87,.05);
    text-align:center;
    display:none;
  }
  .fq-ergebnis.aktiv{ display:block; }
  .fq-ergebnis .score{
    font-family:Georgia, serif;
    font-size:2.6rem;
    font-weight:700;
    color:var(--ordnen-tief);
    line-height:1;
    margin:0 0 10px;
  }
  .fq-ergebnis h3{
    font-family:Georgia, serif;
    color:var(--ordnen-tief);
    font-size:1.2rem;
    margin:0 0 8px;
  }
  .fq-ergebnis p{
    margin:6px 0 0;
    color:#3a3a3a;
    line-height:1.5;
    font-size:1rem;
  }
  .fq-ergebnis a{
    color:var(--ordnen);
    text-decoration:underline;
  }
  .fq-btn{
    background:var(--ordnen);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:11px 22px;
    font:inherit;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(93,111,123,.25);
  }
  .fq-btn:hover{ background:var(--ordnen-tief); }
  .fq-btn:disabled{ opacity:.45; cursor:default; box-shadow:none; }

  @media (max-width:380px){
    .fq-karte .name{ font-size:.82rem; }
    .fq-karte .latein{ font-size:.72rem; }
  }
</style>
</head>
<body>

<main id="fq-root">
  <div class="fq-kopfzeile">
    <a class="fq-home" href="../index.html">‹ Startseite</a>
    <div class="fq-zaehler" id="fq-zaehler">Runde 1 · 0 Treffer</div>
  </div>
  <h2 class="fq-titel">Welche Pflanze passt nicht?</h2>

  <div class="fq-karten" id="fq-karten"></div>

  <div class="fq-aufloesung" id="fq-aufloesung">
    <h3 id="fq-aufloesung-titel"></h3>
    <p id="fq-aufloesung-text"></p>
  </div>

  <div class="fq-ergebnis" id="fq-ergebnis">
    <div class="score" id="fq-score"></div>
    <h3 id="fq-ergebnis-titel"></h3>
    <p id="fq-ergebnis-text"></p>
  </div>

  <div class="fq-buttons">
    <button class="fq-btn" id="fq-neu" disabled>Nächste Runde ›</button>
  </div>
</main>

<script>
// Stichprobe:
//   {'slug': 'galanthus-nivalis', 'fam': 'Amaryllisgewächse', 'de': 'Schneeglöckchen', 'wiss': 'Galanthus nivalis'}
//   {'slug': 'anemone-nemorosa', 'fam': 'Hahnenfußgewächse', 'de': 'Buschwindröschen', 'wiss': 'Anemone nemorosa'}
//   {'slug': 'ficaria-verna', 'fam': 'Hahnenfußgewächse', 'de': 'Scharbockskraut', 'wiss': 'Ficaria verna'}

let ARTEN = [];  // aus pflanzen.json

const FAMILIEN = {
  "Amaryllisgewächse": "Zwiebelpflanzen mit sechs Blütenblättern. Bekannte Vertreter: Schneeglöckchen, Bärlauch, Märzenbecher.",
  "Hahnenfußgewächse": "Sehr alte Familie mit fünf glänzenden Kronblättern. Buschwindröschen, Sumpfdotterblume, Trollblume — viele giftig.",
  "Mohngewächse": "Beim Anbrechen tritt Milchsaft aus — weiß, gelb oder orange. Vier zerknitterte Kronblätter. Klatschmohn, Schöllkraut, Lerchensporn.",
  "Liliengewächse": "Klassische Frühlingsblüher mit sechs Blütenblättern und einer Zwiebel. Tulpen, Lilien, Gelbstern.",
  "Sauerkleegewächse": "Kleeartige dreiteilige Blätter, die abends einklappen. Saurer Geschmack durch Oxalsäure. Wald-Sauerklee.",
  "Raublattgewächse": "Rauh behaarte Blätter — fühlen sich wie feines Sandpapier an. Blüten oft mit Farbwechsel von rosa zu blau. Borretsch, Vergissmeinnicht, Lungenkraut.",
  "Schmetterlingsblütler": "Berühmte Blütenform: Fahne, zwei Flügel, Schiffchen — wie ein sitzender Schmetterling. Bilden Hülsen als Frucht. Erbse, Bohne, Klee — wichtig wegen Stickstoff-Bindung im Boden.",
  "Lippenblütler": "Vierkantige Stängel, gegenständige Blätter, Blüten mit Ober- und Unterlippe. Oft aromatisch: Minze, Thymian, Salbei, Taubnessel.",
  "Spargelgewächse": "Vielfältige Gruppe mit Zwiebel oder Rhizom. Dazu gehören Maiglöckchen, Salomonssiegel, Blaustern, Traubenhyazinthe.",
  "Veilchengewächse": "Asymmetrische Blüten mit Sporn nach hinten. Märzveilchen, Stiefmütterchen.",
  "Kreuzblütler": "Vier Kronblätter über Kreuz, sechs Staubblätter (vier lange, zwei kurze). Senf, Raps, Hirtentäschel, Knoblauchsrauke.",
  "Nelkengewächse": "Gegenständige Blätter, oft gespaltene Kronblätter. Stängel an den Knoten wie aufgeblasen. Lichtnelken, Sternmieren, Vogelmiere.",
  "Korbblütler": "Was wie eine einzelne Blüte aussieht, ist ein „Körbchen\" aus vielen Einzelblüten. Riesige Familie: Gänseblümchen, Löwenzahn, Kornblume, Sonnenblume.",
  "Wegerichgewächse": "Vier kleine Kronblätter, oft windbestäubt. Spitz- und Breit-Wegerich, Ehrenpreis, Fingerhut.",
  "Primelgewächse": "Frühe Frühlingsblüher mit grundständiger Blattrosette. Schlüsselblume, Pfennigkraut.",
  "Rosengewächse": "Fünf Kronblätter und meist viele Staubblätter. Sehr vielfältig: Rose, Apfel, Erdbeere, Mädesüß — ein Großteil unseres Obstes.",
  "Glockenblumengewächse": "Blüten meist glockenförmig, oft blau-violett. Klassisches Beispiel: die Acker-Glockenblume.",
  "Storchschnabelgewächse": "Fünf Kronblätter, lange schnabelartige Frucht — wie ein Storchenschnabel. Streut die Samen mit Schleudermechanismus aus.",
  "Malvengewächse": "Fünf Kronblätter, viele zu einer Säule verwachsene Staubblätter. Wilde Malve, Linde, Kakao.",
  "Sperrkrautgewächse": "Trichterblüten mit fünf Zipfeln, gefiederte Blätter. Vertreter: Himmelsleiter.",
  "Knöterichgewächse": "Stängel mit deutlichen „Knoten\" und tütenförmigen Blattnebenchen (Ochrea). Wiesen-Knöterich, Ampfer.",
  "Enziangewächse": "Oft tiefblaue, fünfzählige Trichterblüten. Bitterstoffe in den Wurzeln. Bekannt aus Bergwiesen — und vom Schnaps.",
  "Nachtkerzengewächse": "Vier Kronblätter, unterständiger Fruchtknoten. Manche öffnen sich erst abends. Weidenröschen, Nachtkerze.",
  "Balsaminengewächse": "Saftige, fast knorpelige Stängel. Reife Samenkapseln schnellen bei Berührung explosionsartig auf — daher „Springkraut\".",
  "Weiderichgewächse": "Sechs leuchtend rosa Kronblätter, viele Staubblätter. Liebt feuchte Stellen. Blut-Weiderich.",
  "Doldenblütler": "Viele winzige weiße Blüten in schirmartigen Dolden. Aromatische Pflanzen — viele Kräuter (Petersilie, Dill), aber auch giftige Arten (Schierling).",
  "Rötegewächse": "Stängel mit Quirlblättern, kleine weiße oder gelbe vierzählige Blüten. Labkräuter, Waldmeister — und Kaffee.",
  "Hartheugewächse": "Gelbe, fünfzählige Blüten mit vielen Staubblättern. Die Blätter zeigen im Gegenlicht durchscheinende Pünktchen. Echtes Johanniskraut.",
  "Windengewächse": "Schlingpflanzen mit großen Trichterblüten, die sich im Tagesverlauf öffnen und schließen. Acker-Winde, Zaunwinde.",
  "Wolfsmilchgewächse": "Beim Anbrechen tritt giftiger weißer Milchsaft aus. Eigentümliche Blütenstände: Was wie eine Blüte aussieht, ist eine Gruppe winziger Einzelblüten.",
  "Steinbrechgewächse": "Polsterbildner an Fels und in feuchten Wäldern. Fünfzählige Blüten. Milzkraut, Steinbrech.",
  "Geißblattgewächse": "Sträucher und Schlingpflanzen mit duftenden, oft röhrigen Blüten. Heckenkirsche, Geißblatt, Holunder.",
  "Bitterkleegewächse": "Sumpf- und Wasserpflanzen mit dreiteiligen Blättern und auffällig bewimperten Blütenblättern. Vertreter: Fieberklee.",
  "Brennnesselgewächse": "Unscheinbare Blüten, dafür berühmt für ihre Brennhaare. Klassiker: Große Brennnessel.",
  "Sommerwurzgewächse": "Voll- und Halbschmarotzer ohne eigenes Blattgrün. Saugen Nährstoffe direkt aus den Wurzeln anderer Pflanzen. Sommerwurz, Klappertopf.",
  "Kreuzblümchengewächse": "Kleine, schmetterlingsförmige Blüten — aber keine Schmetterlingsblütler. Zwei seitliche Kelchblätter wirken wie Flügel."
};

/* ---------- Spiel-Logik ---------- */

const elKarten   = document.getElementById('fq-karten');
const elTitel    = document.querySelector('.fq-titel');
const elAufl     = document.getElementById('fq-aufloesung');
const elAuflTit  = document.getElementById('fq-aufloesung-titel');
const elAuflTxt  = document.getElementById('fq-aufloesung-text');
const elErg      = document.getElementById('fq-ergebnis');
const elScore    = document.getElementById('fq-score');
const elErgTit   = document.getElementById('fq-ergebnis-titel');
const elErgTxt   = document.getElementById('fq-ergebnis-text');
const elZaehler  = document.getElementById('fq-zaehler');
const elNeu      = document.getElementById('fq-neu');

const MAX_RUNDEN = 10;

// Familien mit mindestens 3 Arten → diese sind als Mehrheitsfamilie geeignet
let FAM_COUNT = {};
let MEHRHEITS_FAMILIEN = [];

let runde = 1;
let treffer = 0;
let aktuell = null; // {mehrheit, aussenseiter_index, karten}

function zufaellig(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(a){
  for (let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function neueRunde(){
  // 1) Eine Mehrheitsfamilie wählen
  const mehrheit = zufaellig(MEHRHEITS_FAMILIEN);
  // 2) 3 Arten aus dieser Familie ziehen
  const pool = ARTEN.filter(a => a.fam === mehrheit);
  const dreier = shuffle([...pool]).slice(0,3);
  // 3) Eine Art aus einer anderen Familie als Außenseiter
  const andere = ARTEN.filter(a => a.fam !== mehrheit);
  const aussen = zufaellig(andere);
  // 4) Mischen, Position merken
  const karten = shuffle([...dreier, aussen]);
  const aussenIdx = karten.indexOf(aussen);

  aktuell = { mehrheit, karten, aussenIdx };

  // Rendern
  elKarten.innerHTML = '';
  karten.forEach((art, idx) => {
    const card = document.createElement('button');
    card.className = 'fq-karte';
    card.type = 'button';
    card.dataset.idx = idx;
    card.innerHTML =
      `<img src="../images/tafeln/${art.slug}.jpg" alt="${art.de}" loading="lazy">` +
      `<div class="name">${art.de}</div>` +
      `<div class="latein">${art.wiss}</div>`;
    card.addEventListener('click', () => tippe(idx));
    elKarten.appendChild(card);
  });

  elAufl.classList.remove('aktiv');
  elNeu.disabled = true;
  elZaehler.textContent = `Runde ${runde} / ${MAX_RUNDEN} · ${treffer} Treffer`;
}

function tippe(idx){
  if (elNeu.disabled === false) return; // bereits ausgewertet

  const richtig = idx === aktuell.aussenIdx;
  if (richtig) treffer++;

  // Karten markieren
  [...elKarten.children].forEach((card, i) => {
    card.classList.add('locked');
    if (i === aktuell.aussenIdx) card.classList.add('aussenseiter');
    else if (i === idx && !richtig) card.classList.add('falsch');
  });

  // Auflösung anzeigen
  const aussenArt = aktuell.karten[aktuell.aussenIdx];
  const fam = aktuell.mehrheit;
  const famText = FAMILIEN[fam] || '';
  if (richtig){
    elAuflTit.className = 'korrekt';
    elAuflTit.textContent = '🌿 Richtig!';
  } else {
    elAuflTit.className = 'falsch';
    elAuflTit.textContent = 'Knapp daneben.';
  }
  elAuflTxt.innerHTML =
    `Drei davon sind <span class="familie-name">${fam}</span> — der Außenseiter ist ` +
    `<b>${aussenArt.de}</b> (Familie ${aussenArt.fam}).<br><br>${famText}`;
  elAufl.classList.add('aktiv');

  // Letzte Runde? Dann Button-Beschriftung umstellen
  if (runde >= MAX_RUNDEN) {
    elNeu.textContent = 'Auswertung ›';
  }
  runde++;
  elNeu.disabled = false;
  elZaehler.textContent = `Runde ${runde-1} / ${MAX_RUNDEN} · ${treffer} Treffer`;
}

function zeigeErgebnis(){
  // Spielfeld ausblenden, Auswertung in den Vordergrund
  elKarten.style.display = 'none';
  elAufl.classList.remove('aktiv');
  elTitel.style.display  = 'none';

  elScore.textContent = `${treffer} / ${MAX_RUNDEN}`;
  let titel, text;
  if (treffer === 10){
    titel = '🏆 Alle zehn richtig!';
    text  = 'Du sortierst die Pflanzen wie ein alter Botaniker — Linné würde anerkennend nicken.';
  } else if (treffer >= 8){
    titel = '🌟 Stark!';
    text  = 'Die typischen Familien-Merkmale sitzen bestens.';
  } else if (treffer >= 6){
    titel = '🌿 Gut gemacht!';
    text  = 'Solider Familien-Blick — mit ein bisschen Übung wirst du zum Profi.';
  } else if (treffer >= 4){
    titel = 'Mittelfeld.';
    text  = 'Schau dir die <a href="../interaktiv/systematik.html">Systematik</a> nochmal an, dann fällt’s leichter.';
  } else {
    titel = 'Aller Anfang …';
    text  = 'Familien zu lesen will gelernt sein. Der <a href="../interaktiv/systematik.html">Stammbaum</a> hilft beim nächsten Anlauf!';
  }
  elErgTit.textContent = titel;
  elErgTxt.innerHTML   = text;
  elErg.classList.add('aktiv');
  elNeu.textContent = 'Neues Spiel ›';
  elZaehler.textContent = `Endstand · ${treffer} / ${MAX_RUNDEN}`;
}

function neuesSpiel(){
  runde = 1;
  treffer = 0;
  elErg.classList.remove('aktiv');
  elKarten.style.display = '';
  elTitel.style.display  = '';
  elNeu.textContent = 'Nächste Runde ›';
  neueRunde();
}

elNeu.addEventListener('click', () => {
  if (elErg.classList.contains('aktiv')) {
    // Auswertung sichtbar → Neues Spiel
    neuesSpiel();
  } else if (runde > MAX_RUNDEN) {
    // Letzte Runde gespielt, jetzt Auswertung anzeigen
    zeigeErgebnis();
  } else {
    elNeu.disabled = true;
    neueRunde();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Erste Runde – Daten aus zentraler Quelle laden
fetch('../pflanzen.json')
  .then(function (r) { return r.json(); })
  .then(function (d) {
    ARTEN = d.map(function (p) { return { slug: p.slug, fam: p.familie_de, de: p.deutsch, wiss: p.wiss }; });
    FAM_COUNT = {};
    ARTEN.forEach(function (a) { FAM_COUNT[a.fam] = (FAM_COUNT[a.fam] || 0) + 1; });
    MEHRHEITS_FAMILIEN = Object.keys(FAM_COUNT).filter(function (f) { return FAM_COUNT[f] >= 3; });
    neueRunde();
  })
  .catch(function () {
    if (elTitel) elTitel.textContent = 'Daten konnten nicht geladen werden.';
  });
</script>
